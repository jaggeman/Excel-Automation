<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kleer Data</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    --ink: #250C2E;
    --ink-soft: #3A1A45;
    --slate: #7A6685;
    --muted-on-dark: #B9A6C4;
    --paper: #F8F3E9;
    --line: #E7DCC8;
    --lilac: #EEE1FB;
    --accent: #F2A430;
    --accent-hover: #DD8F1E;
    --accent-ink: #250C2E;
    --ok: #3C6E52;
    --err: #A23B2E;
    font-size: 15px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", "Inter", -apple-system, sans-serif;
    line-height: 1.4;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 18px 16px 18px;
    background: var(--ink);
    background-image: radial-gradient(circle at 85% -20%, var(--ink-soft) 0%, transparent 60%);
  }

  header .name {
    color: var(--paper);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
  }

  header .sub {
    color: var(--muted-on-dark);
    font-size: 11.5px;
    margin-top: 1px;
  }

  main {
    padding: 18px;
  }

  .field-label {
    font-size: 12px;
    color: var(--slate);
    margin-bottom: 5px;
    display: block;
  }

  select, input[type="text"], input[type="password"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: #FFFFFF;
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
  }

  select:focus, input[type="text"]:focus, input[type="password"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .secret-field {
    position: relative;
    margin-bottom: 14px;
  }
  .secret-field input {
    width: 100%;
    padding-right: 56px;
    margin-bottom: 0;
  }
  .secret-toggle {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--slate);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 8px;
  }
  .secret-toggle:hover { color: var(--ink); }
  .secret-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }

  button.primary {
    width: 100%;
    padding: 10px 12px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 5px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  button.primary:hover { background: var(--accent-hover); }
  button.primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button.primary:disabled { background: #E9DCC3; color: #A99A82; cursor: default; }

  button.secondary {
    width: 100%;
    padding: 9px 12px;
    background: var(--lilac);
    color: var(--ink);
    border: none;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button.secondary:hover { filter: brightness(0.97); }

  .status {
    margin-top: 12px;
    font-size: 12.5px;
    padding: 8px 10px;
    border-radius: 5px;
    display: none;
  }
  .status.show { display: block; }
  .status.info { background: var(--lilac); color: var(--ink-soft); }
  .status.ok { background: #E4EEE8; color: var(--ok); }
  .status.err { background: #F3E4E1; color: var(--err); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    background: var(--lilac);
    border-radius: 20px;
    padding: 3px 10px 3px 3px;
    margin-bottom: 14px;
  }
  .badge .pill {
    background: var(--ink);
    color: var(--paper);
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 10.5px;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--line);
    margin: 18px 0;
  }

  .preview-title {
    font-size: 12px;
    color: var(--slate);
    margin-bottom: 8px;
  }

  table.preview {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  table.preview th {
    text-align: left;
    font-weight: 600;
    color: var(--slate);
    border-bottom: 1px solid var(--line);
    padding: 5px 6px;
  }
  table.preview td {
    padding: 5px 6px;
    border-bottom: 1px solid #EAE7DF;
  }

  footer {
    padding: 10px 18px 16px 18px;
    font-size: 11px;
    color: var(--slate);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  footer .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
</style>
</head>
<body>

  <header>
    <div>
      <div class="name">Kleer Data</div>
      <div class="sub">Standardiserad datahämtning</div>
    </div>
  </header>

  <main>
    <div class="badge"><span class="pill">Demo</span> Hämtar direkt från Kleer</div>

    <label class="field-label" for="apiToken">API-token</label>
    <div class="secret-field">
      <input type="password" id="apiToken" placeholder="Din Kleer API-token" autocomplete="off" />
      <button type="button" class="secret-toggle" data-target="apiToken" aria-label="Visa API-token">Visa</button>
    </div>

    <label class="field-label" for="period">Period (valfritt filter, t.ex. 2026-08)</label>
    <input type="text" id="period" placeholder="Lämna tomt för alla fakturor" />

    <button class="primary" id="fetchBtn">Hämta fakturor</button>

    <div class="status info" id="status">Nyckeln sparas inte – klistra in den varje gång.</div>

    <hr class="divider" />

    <div class="preview-title">Förhandsvisning</div>
    <table class="preview" id="previewTable">
      <thead>
        <tr><th>Datum</th><th>Beskrivning</th><th>Belopp</th></tr>
      </thead>
      <tbody id="previewBody">
        <tr><td colspan="3" style="color:#93A0AF;">Ingen data hämtad ännu</td></tr>
      </tbody>
    </table>
  </main>

  <footer>
    <span class="dot" aria-hidden="true"></span> Nyckeln lämnar aldrig den här enheten
  </footer>

<script>
  Office.onReady(() => {
    document.getElementById("fetchBtn").addEventListener("click", handleFetch);
    document.querySelectorAll(".secret-toggle").forEach(btn => {
      btn.addEventListener("click", () => toggleSecretVisibility(btn));
    });
  });

  // Bolaget denna add-in är byggd för (Kleer-token är knuten till ett specifikt bolag).
  const KLEER_COMPANY_ID = "6485";
  const KLEER_API_BASE = "https://demo.kleer.se/demo-api/v1/company/" + KLEER_COMPANY_ID;

  function toggleSecretVisibility(btn) {
    const input = document.getElementById(btn.dataset.target);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.textContent = show ? "Dölj" : "Visa";
    btn.setAttribute("aria-label", (show ? "Dölj " : "Visa ") + "API-token");
  }

  function setStatus(kind, text) {
    const el = document.getElementById("status");
    el.className = "status show " + kind;
    el.textContent = text;
  }

  async function handleFetch() {
    const btn = document.getElementById("fetchBtn");
    const apiToken = document.getElementById("apiToken").value.trim();
    const period = document.getElementById("period").value.trim();

    if (!apiToken) {
      setStatus("err", "Fyll i API-token.");
      return;
    }

    btn.disabled = true;
    setStatus("info", "Hämtar fakturor …");

    try {
      const res = await fetch(KLEER_API_BASE + "/client-invoice", {
        headers: { "X-Token": apiToken, "Accept": "application/xml" }
      });

      if (!res.ok) {
        const body = await res.text().catch(() => "");
        if (res.status === 401) {
          throw new Error("Ogiltig API-token (401). Kontrollera att token stämmer för bolag " + KLEER_COMPANY_ID + ".");
        }
        if (res.status === 403) {
          throw new Error("Blockerad av CORS (403) – detta ursprung är inte tillåtet för den här token:en hos Kleer. " + body);
        }
        throw new Error("Kleer svarade " + res.status + (body ? ": " + body : ""));
      }

      const xmlText = await res.text();
      let rows = parseInvoiceXml(xmlText);

      if (period) {
        rows = rows.filter(r => r.datum.includes(period));
      }

      renderPreview(rows);
      await writeToSheet(rows);
      setStatus("ok", "Klart. " + rows.length + " rader infogade i arket.");
    } catch (err) {
      setStatus("err", "Något gick fel: " + err.message);
    } finally {
      btn.disabled = false;
    }
  }

  // Kleers API svarar med XML. Elementnamnen för client-invoice är inte
  // verifierade mot en riktig respons än (blockerat av CORS/VPN vid byggtillfället),
  // så vi plockar ut fält löst baserat på vad taggnamnen ser ut att innehålla
  // istället för att anta exakt schema.
  function parseInvoiceXml(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    if (doc.querySelector("parsererror")) {
      throw new Error("Kunde inte tolka XML-svaret från Kleer.");
    }

    const root = doc.documentElement;
    const items = Array.from(root.children).length ? Array.from(root.children) : [root];

    return items.map(item => {
      const fields = {};
      item.querySelectorAll("*").forEach(node => {
        if (node.children.length === 0) {
          fields[node.tagName.toLowerCase()] = node.textContent.trim();
        }
      });

      const findField = (...keywords) => {
        const key = Object.keys(fields).find(k => keywords.some(kw => k.includes(kw)));
        return key ? fields[key] : "";
      };

      const datum = findField("date");
      const belopp = findField("amount", "total", "sum");
      const beskrivning = findField("name", "client", "customer", "description", "text", "number") || "(okänt fält – se rådata)";

      return { datum, beskrivning, belopp, raw: fields };
    });
  }

  function renderPreview(rows) {
    const body = document.getElementById("previewBody");
    body.innerHTML = "";
    rows.forEach(r => {
      const tr = document.createElement("tr");
      ["datum", "beskrivning", "belopp"].forEach(key => {
        const td = document.createElement("td");
        td.textContent = r[key];
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  }

  async function writeToSheet(rows) {
    await Excel.run(async (context) => {
      const sheet = context.workbook.worksheets.getActiveWorksheet();
      const header = [["Datum", "Beskrivning", "Belopp"]];
      const data = rows.map(r => [r.datum, r.beskrivning, r.belopp]);

      const range = sheet.getRange("A1").getResizedRange(data.length, 2);
      range.values = header.concat(data);
      range.format.autofitColumns();

      await context.sync();
    });
  }
</script>

</body>
</html>
